name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
      # Hard L3 bench gate (workspace#72): fails on missing bench groups or
      # >=50% regression vs the committed benchmarks/baseline.json.
      - name: Bench gate
        run: deno task bench:check
