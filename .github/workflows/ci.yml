name: CI

on:
  pull_request: # all bases — stacked PRs target feature branches, not just main
  push:
    branches:
      - main

jobs:
  # Format, lint, type check, manifest check, tests, examples and the sql-core
  # purity gate all run through `bun run ci`. Bun floats on 1.x on purpose so a
  # Bun regression surfaces early.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run CI checks
        run: bun run ci
      - name: Publish dry run (smoke)
        run: bun run publish:dry
      # Hard L3 bench gate (workspace#72): fails on missing bench groups or
      # >=50% regression vs the committed benchmarks/baseline.json.
      - name: Bench gate
        run: bun run bench:check

  # Runtime-portability gate (worlds-sqlite#24): the SqliteStore + driver
  # suite must pass over a bun:sqlite handle exactly as it does over
  # node:sqlite. This version is not the toolchain: it stays pinned to Bun
  # 1.3.x — the release line that cannot resolve node:sqlite at all — so the
  # AnySyncSqliteHandle seam is enforced on the runtime it exists for. The
  # node:sqlite leg runs in the `ci` job above.
  bun-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install bun deps
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run SqliteStore + driver suite under bun:sqlite
        run: bun test src/sqlite/runtime-portability/bun-handle.portability.test.ts
